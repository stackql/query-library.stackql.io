name: Query Library CI

on:
  pull_request:
    paths:
      - 'query-library/**'
      - 'static/docs/query-library/**'
      - '.github/workflows/query-library-ci.yml'
  push:
    branches: [main]
    paths:
      - 'query-library/**'
      - 'static/docs/query-library/**'
      - '.github/workflows/query-library-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install script dependencies
        run: pip install -r query-library/scripts/requirements.txt

      - name: Validate entries (schema, parity, ids, related refs)
        run: python query-library/scripts/validate.py

      - name: Check committed artifacts are up to date
        run: |
          python query-library/scripts/build-artifacts.py
          # Covers the static artifacts and the generated provider .mdx
          # stubs; --porcelain also catches newly created (untracked) files.
          if [ -n "$(git status --porcelain -- query-library static/docs/query-library)" ]; then
            git status --porcelain -- query-library static/docs/query-library
            git diff -- query-library static/docs/query-library | head -100
            echo "::error::generated files are stale. Run 'python query-library/scripts/build-artifacts.py' and commit the result."
            exit 1
          fi

      # Our own action, rather than hand-rolling the download: it resolves the
      # latest release, caches the binary and puts it on PATH, so render-check
      # finds it via shutil.which without a path being threaded through.
      - name: Setup stackql
        uses: stackql/setup-stackql@v2
        with:
          use_wrapper: false

      - name: Render templates and run stackql preprocessor check (no execution)
        run: python query-library/scripts/render-check.py --require-binary
